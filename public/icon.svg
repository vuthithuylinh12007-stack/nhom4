<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="taegeukRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="taegeukBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with squircle/rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#60A5FA" stroke-width="4" stroke-dasharray="12 12" opacity="0.4" />

  <!-- Taegeuk Inspired emblem -->
  <g filter="url(#shadow)" transform="translate(256, 210) scale(0.95)">
    <!-- Red Top Curve -->
    <path d="M 0 -100 A 100 100 0 0 1 0 100 A 50 50 0 0 1 0 0 A 50 50 0 0 0 0 -100 Z" fill="url(#taegeukRed)" />
    <!-- Blue Bottom Curve -->
    <path d="M 0 -100 A 50 50 0 0 1 0 0 A 50 50 0 0 0 0 100 A 100 100 0 0 1 0 -100 Z" fill="url(#taegeukBlue)" />
    <!-- Center letter "한" in white -->
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">한</text>
  </g>

  <!-- App name banner "HanGo" -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-36" width="280" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.95" filter="url(#shadow)" />
    <text x="-4" y="4" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#0F172A" text-anchor="middle">
      <tspan fill="#2563EB">Han</tspan><tspan fill="#E11D48">Go</tspan>
    </text>
    <!-- Little star accent -->
    <circle cx="95" cy="-8" r="5" fill="#F59E0B" />
  </g>
</svg>
