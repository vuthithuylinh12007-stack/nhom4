<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="goGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle Shine Gradient -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.45" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGradient)" />

  <!-- Top Glass Highlight -->
  <path d="M 0 116 C 0 52 52 0 116 0 L 396 0 C 460 0 512 52 512 116 L 512 210 C 370 240 140 240 0 210 Z" fill="url(#shineGradient)" />

  <!-- Inner Border Line -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />

  <!-- Ambient Glow Behind Text -->
  <circle cx="256" cy="256" r="140" fill="#38BDF8" opacity="0.12" filter="url(#softGlow)" />

  <!-- Main "Hango" Wordmark Icon Display -->
  <g filter="url(#textShadow)">
    <text
      x="256"
      y="285"
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-weight="900"
      font-size="112"
      text-anchor="middle"
      letter-spacing="-3"
    >
      <tspan fill="#FFFFFF">Han</tspan><tspan fill="url(#goGradient)">go</tspan>
    </text>
  </g>

  <!-- Dynamic Smile Accent Underline -->
  <path
    d="M 155 330 Q 256 366 357 330"
    stroke="url(#goGradient)"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
    filter="url(#textShadow)"
  />

  <!-- Accent Sparkle Dot -->
  <circle cx="376" cy="226" r="10" fill="#FDE047" filter="url(#textShadow)" />

  <!-- Subtitle Tag: "KOREAN" -->
  <g transform="translate(256, 400)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.15" />
    <text
      x="0"
      y="6"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="800"
      font-size="15"
      fill="#BAE6FD"
      text-anchor="middle"
      letter-spacing="4"
    >
      KOREAN
    </text>
  </g>
</svg>
